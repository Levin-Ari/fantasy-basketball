# You can name this whatever you want
name: update

# You will get an error on the automatic updates committing
# if you do not have this line
# You didn't need it before, which is why a lot of yml job files
# you see will not have it (but you need it now!!!)
permissions:
  contents: write
  
# The 'on' section is about when this is run
# workflow_dispatch makes there be a button on GitHub to let you run it manually
# schedule and cron make it run at certain frequencies
on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This covers the 9 AM Eastern cutoff in either DST offset.
    - cron: '*/15 11-14 * * *'
    # Refresh hourly during the afternoon/evening games in both DST offsets.
    - cron: '0 18-23,0-5 * * *'
concurrency:
  group: daily-output-update
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install all necessary packages
      run: pip install pandas requests
    - name: Updating the daily top players JSON
      run: python daily-creator27.py
    - name: Commit and push any changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
